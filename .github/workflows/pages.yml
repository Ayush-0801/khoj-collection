name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No build step — the site is plain HTML. This stages the files that
      # should be public, which is what .vercelignore does on the other host.
      # upload-pages-artifact takes a single path and no exclude list, so the
      # excluding happens here.
      - name: Stage the public files
        run: |
          rsync -a ./ ./_site/ \
            --exclude '_site/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude '_source/' \
            --exclude 'Logo.png' \
            --exclude 'README.md' \
            --exclude 'vercel.json' \
            --exclude '.vercelignore' \
            --exclude '.gitignore' \
            --exclude '.DS_Store' \
            --exclude '__pycache__/'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v4
